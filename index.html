<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061321"><link rel="manifest" href="manifest.json"><title>JARVIS ULTRA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 20%,#12334c,#061321 60%,#020811);color:#e5f8ff;font-family:system-ui;min-height:100vh}main{max-width:680px;margin:auto;padding:22px 16px}header{text-align:center}h1{color:#57d7ff;letter-spacing:.22em;font-size:36px;margin:8px}.sub{color:#8db5c9;font-size:11px;letter-spacing:.3em}.core{width:185px;height:185px;border-radius:50%;margin:30px auto;display:grid;place-items:center;background:radial-gradient(circle,#0d3048 0 35%,#061827 36% 52%,#0a5274 53% 56%,#071624 57% 66%,#1aa7d5 67% 68%,#071321 69%);box-shadow:0 0 35px #087aa7;animation:pulse 3s infinite}.core span{color:#9feaff;text-align:center;letter-spacing:.2em;font-size:12px}@keyframes pulse{50%{box-shadow:0 0 55px #0aa9e8}}.status{text-align:center;color:#9bbdcd;font-size:13px;min-height:22px}.panel{border:1px solid #1c5773;background:#071a2acc;border-radius:16px;padding:14px;margin-top:16px}#log{height:230px;overflow:auto;white-space:pre-wrap;font-size:14px;line-height:1.5}.msg{margin:0 0 12px}.who{color:#57d7ff;font-size:11px;letter-spacing:.12em}.row{display:flex;gap:8px;margin-top:12px}input{min-width:0;flex:1;background:#0b2639;border:1px solid #24617d;border-radius:10px;color:white;padding:13px;font-size:15px}button{border:1px solid #2b9dc6;background:#0c4765;color:white;border-radius:10px;padding:12px 15px;font-weight:650}.mic{width:100%;margin-top:10px;background:#087da5}.small{font-size:12px;color:#9bbdcd;line-height:1.5}
</style></head><body><main><header><h1>J.A.R.V.I.S</h1><div class="sub">PERSONAL AI SYSTEM</div></header><div class="core"><span>JARVIS<br>ONLINE</span></div><div class="status" id="status">Ready. Tap the microphone to speak.</div>
<section class="panel"><div id="log"><p class="msg"><span class="who">JARVIS</span><br>Good evening. Systems are ready. How may I assist you?</p></div><div class="row"><input id="entry" placeholder="Ask JARVIS something"><button id="send">SEND</button></div><button class="mic" id="mic">🎙 TAP TO SPEAK</button></section>
<section class="panel"><button id="voice">🔊 Test voice</button> <button id="clear">Clear chat</button><p class="small">Starter version: basic local commands and spoken replies. Full AI, wake-word listening and device control need further development and permissions.</p></section></main>
<script>
const $=x=>document.getElementById(x),log=$('log'),status=$('status');
function add(w,t){let p=document.createElement('p'),s=document.createElement('span');p.className='msg';s.className='who';s.textContent=w;p.append(s,document.createElement('br'),document.createTextNode(t));log.append(p);log.scrollTop=log.scrollHeight}
function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.92;u.pitch=.85;speechSynthesis.speak(u)}
function reply(q){let t=q.toLowerCase();if(/hello|hi jarvis|hey jarvis/.test(t))return'Hello. I am online. What would you like me to do?';if(t.includes('time'))return'The time is '+new Date().toLocaleTimeString();if(t.includes('date')||t.includes('today'))return'Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});if(t.includes('your name'))return'I am JARVIS, your personal assistant.';if(t.includes('thank'))return"You're welcome.";return'I heard you say: '+q+'. My full AI brain is not connected yet.'}
function send(q){q=(q||$('entry').value).trim();if(!q)return;$('entry').value='';add('YOU',q);let a=reply(q);add('JARVIS',a);speak(a)}
$('send').onclick=()=>send();$('entry').onkeydown=e=>{if(e.key==='Enter')send()};$('voice').onclick=()=>speak('Good evening. I am JARVIS. How may I assist you?');$('clear').onclick=()=>{log.innerHTML='';add('JARVIS','Chat cleared. Ready.')};
$('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Speech recognition unavailable. Try Chrome.';return}let r=new SR();r.lang='en-IN';r.onstart=()=>status.textContent='Listening…';r.onresult=e=>{status.textContent='Heard: '+e.results[0][0].transcript;send(e.results[0][0].transcript)};r.onerror=e=>status.textContent='Microphone error: '+e.error;r.onend=()=>{if(status.textContent==='Listening…')status.textContent='Ready.'};r.start()};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
